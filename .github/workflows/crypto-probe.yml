name: Crypto probe (temporary)

# Narrows down a Linux crash in swift-crypto P-256 key serialization inside test binaries.
on:
  push:
    branches: [linux-support]
    paths: ['.github/workflows/crypto-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: swift:6.2-bookworm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [exe-crypto-mcp-filehandle, exe-crypto-mcp]
    steps:
      - name: Build and test probe package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/Sources/probe probe/Tests/probeTests && cd probe
          v='${{ matrix.variant }}'
          mcpdep=''; mcpprod=''; mcpimport=''
          if [[ $v == *mcp* ]]; then
            mcpdep='.package(url: "https://github.com/modelcontextprotocol/swift-sdk.git", exact: "0.12.0"),'
            mcpprod='.product(name: "MCP", package: "swift-sdk"),'
            mcpimport='import MCP'
          fi
          kind='executableTarget'
          cat > Package.swift <<EOF
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "probe",
              dependencies: [
                  $mcpdep
                  .package(url: "https://github.com/apple/swift-crypto.git", exact: "5.0.1")
              ],
              targets: [
                  .$kind(name: "probe", dependencies: [$mcpprod .product(name: "Crypto", package: "swift-crypto")]),
                  .testTarget(name: "probeTests", dependencies: ["probe", .product(name: "Crypto", package: "swift-crypto")])
              ]
          )
          EOF
          cat > Sources/probe/Probe.swift <<EOF
          import Crypto
          import Foundation
          $mcpimport
          public enum Probe {
              public static func pem() -> String { P256.Signing.PrivateKey().pemRepresentation }
          }
          EOF
          if [[ $v == *filehandle ]]; then
            cat >> Sources/probe/Probe.swift <<'EOF2'
          extension FileHandle: @retroactive TextOutputStream {
              public func write(_ string: String) {
                  guard let data = string.data(using: .utf8) else { return }
                  self.write(data)
              }
          }
          EOF2
          fi
          if [[ $kind == executableTarget ]]; then
            printf '@main struct Main { static func main() { print(Probe.pem().count) } }\n' > Sources/probe/Main.swift
          fi
          cat > Tests/probeTests/ProbeTests.swift <<'EOF'
          import Crypto
          import Foundation
          import Testing
          @testable import probe
          @Test func pemRoundTrip() throws {
              let key = try P256.Signing.PrivateKey(pemRepresentation: Probe.pem())
              let signature = try key.signature(for: Data("probe".utf8))
              #expect(signature.rawRepresentation.count == 64)
          }
          EOF
          set +e
          out="$(swift test 2>&1)"; code=$?
          echo "$out" | tail -60
          if [ $code -ne 0 ]; then
            echo "::error title=$v failed::$(echo "$out" | grep -E 'crashed|signal|error:' | head -5 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=$v ok::tests passed"
